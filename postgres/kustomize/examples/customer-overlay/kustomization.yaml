# TEMPLATE — copy this folder out of the vendor repository before editing it.
# Your overlay belongs in your own Git repository, or under $AUTONOX_HOME if
# there is none. Anything left here is replaced wholesale on the next AutoNox
# upgrade. See ../../README.md, "How to deploy (customer workflow)".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Customer-specific namespace goes here
namespace: autonox

resources:
  # Vendor reference — resolves only inside this repo. After copying out,
  # replace it with a pinned Git ref or a vendored path (README step 2):
  #   github.com/autonox-ai/deploy//postgres/kustomize/overlays/openshift?ref=<vendor-version>
  # The OpenShift overlay works on vanilla Kubernetes too in many clusters.
  - ../../overlays/openshift
  # Rename to secret.pgvector-db.yaml when you fill it in, or drop this line
  # and have your secret manager create the pgvector-db Secret.
  - secret.pgvector-db.example.yaml

patches:
  # Set PVC size (default in base is 10Gi)
  - target:
      kind: StatefulSet
      name: pgvector
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 50Gi

  # Optional: set StorageClass explicitly (remove this patch if you want the cluster default)
  - target:
      kind: StatefulSet
      name: pgvector
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: managed-csi
